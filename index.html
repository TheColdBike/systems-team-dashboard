function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function day(s){return Date.parse(s+'T12:00:00Z')/86400000}function dateAdd(s,n){return new Date((day(s)+n)*86400000).toISOString().slice(0,10)}
function fmtDate(s,year=false){return s?new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',...(year?{year:'numeric'}:{})}):'—'}

function person(id){return S.profiles.find(p=>p.id===id)?.display_name||'Team member'}function admin(){return !S.demo&&['owner','admin'].includes(S.profile?.role)}
function editable(t){return !S.demo&&(admin()||t.owner_id===S.profile?.id)}
function activeTasks(){return S.tasks.filter(t=>!t.archived)}function subteams(team){return S.subteams.filter(s=>!s.archived&&s.team===team)}
function overdue(t){return t.end_date<today()&&t.status!=='Complete'}function blockedBy(t){return t.dependencies.map(id=>activeTasks().find(x=>x.id===id)).filter(x=>x&&x.status!=='Complete')}
function rollup(ts){let total=0,weighted=0;for(const t of ts){const duration=day(t.end_date)-day(t.start_date)+1;total+=duration;weighted+=duration*t.progress}return total?Math.round(weighted/total):0}
function badge(text){return `<span class="badge ${text.toLowerCase().replace(/\s+/g,'-')}">${esc(text)}</span>`}

function setSession(v){S.session=v;try{v?localStorage.setItem('mission-control-session',JSON.stringify(v)):localStorage.removeItem('mission-control-session')}catch{}}
let refreshing=null;
async function request(path,{method='GET',body,auth=true}={}){
 if(auth&&S.session&&(S.session.expires_at||0)<Date.now()/1000+60)await refreshSession();
 const headers={apikey:CONFIG.key,'Content-Type':'application/json'};if(auth){if(!S.session?.access_token)throw Error('Please sign in again.');headers.Authorization='Bearer '+S.session.access_token;}
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);let r;try{r=await fetch(CONFIG.url+path,{method,headers,signal:controller.signal,body:body===undefined?undefined:JSON.stringify(body)});}catch(e){throw Error(e.name==='AbortError'?'The connection timed out. Your input is still here; please try again.':'Cannot reach the workspace. Check your connection and try again.');}finally{clearTimeout(timeout)}
 let data=null;const str=await r.text();try{data=str?JSON.parse(str):null}catch{throw Error('The service returned an unexpected response.')}
 if(!r.ok)throw Error(data?.msg||data?.error_description||data?.message||data?.error||'Unable to complete the request.');return data;
}
async function refreshSession(){if(refreshing)return refreshing;refreshing=(async()=>{try{if(!S.session?.refresh_token)throw Error('Please sign in again.');const v=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:S.session.refresh_token}});setSession({...v,expires_at:Date.now()/1000+v.expires_in})}catch(e){setSession(null);throw e}finally{refreshing=null}})();return refreshing}
async function rpc(name,args){return request('/rest/v1/rpc/'+name,{method:'POST',body:args})}

function authPage(mode='signin',message=''){
 S.demo=false;$('#root').innerHTML=`<div class="auth-page"><section class="auth-intro"><div class="brand"><span class="brand-mark">M</span><div><div class="brand-title">Mission Control</div><small>SYSTEMS WORKSPACE</small></div></div><div class="eyebrow">AAE 45000 · TEAM OPERATIONS</div><h1>One mission.<br>Every moving part.</h1><p>Keep your teams, task dependencies, system budgets, and schedule in view.</p><div class="auth-diagram"><span>Systems</span><span>Ground</span><span>Aerial</span></div><div class="auth-footer">Your team’s work, connected.</div></section><section class="auth-form-area"><div class="auth-box"><h2>${mode==='recovery'?'Set a new password':'Welcome to your workspace'}</h2><p>${mode==='recovery'?'Choose a password with at least 12 characters.':'Sign in to plan, track, and move the mission forward.'}</p>${mode!=='recovery'?`<div class="auth-tabs"><button data-action="auth-signin" class="${mode==='signin'?'active':''}">Sign in</button><button data-action="auth-signup" class="${mode==='signup'?'active':''}">Create account</button></div>`:''}${message?`<div class="notice" style="margin-bottom:20px">${esc(message)}</div>`:''}<form class="auth-form" id="auth-form" data-mode="${mode}">${mode==='signup'?'<div class="field"><label for="display-name">Your name</label><input id="display-name" name="display_name" autocomplete="name" required maxlength="80" placeholder="First and last name"></div>':''}${mode!=='recovery'?'<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>':''}<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="${mode==='signin'?'current-password':'new-password'}" required ${mode==='signin'?'':'minlength="12"'} placeholder="${mode==='signin'?'Your password':'At least 12 characters'}"></div>${mode==='signin'?'<div style="text-align:right"><button type="butt function sampleData(){const d=today();S.demo=true;S.profile={id:'sample-owner',display_name:'Kaden Carter',role:'owner'};S.profiles=[S.profile,{id:'sample-ground',display_name:'Ground lead',role:'member'},{id:'sample-aerial',display_name:'Aerial lead',role:'member'}];S.mission='Lunar Exploration Mission';S.subteams=[{id:'s1',team:'Systems',name:'Mission & requirements'},{id:'s2',team:'Systems',name:'Integration & verification'},{id:'s3',team:'Ground',name:'Surface operations'},{id:'s4',team:'Ground',name:'Communications'},{id:'s5',team:'Aerial',name:'Flight dynamics'},{id:'s6',team:'Aerial',name:'Avionics & autonomy'}];const raw=[['t1','Systems','s1','Define mission success criteria',-21,-11,100,'Complete','High',[]],['t2','Systems','s1','Baseline system requirements',-10,3,65,'In progress','High',['t1']],['t3','Systems','s2','Prepare interface control document',-4,10,35,'In progress','High',['t2']],['t4','Systems','s2','Plan integrated verification',12,24,0,'Not started','Medium',['t3','t6','t9']],['t5','Ground','s3','Complete terrain mobility model',-15,-2,80,'In progress','High',['t1']],['t6','Ground','s3','Verify rover traverse performance',4,15,0,'Not started','Medium',['t5']],['t7','Ground','s4','Close surface link budget',-7,7,30,'Blocked','High',['t2']],['t8','Aerial','s5','Validate flight dynamics model',-14,1,70,'In progress','High',['t1']],['t9','Aerial','s5','Evaluate trajectory margins',3,14,0,'Not started','Medium',['t8']],['t10','Aerial','s6','Demonstrate autonomy state machine',-5,12,40,'In progress','Medium',['t2']]];

function dashboardView(){const ts=activeTasks(),completed=ts.filter(t=>t.status==='Complete').length,late=ts.filter(overdue).length;const risks=S.sections.filter(s=>!s.archived&&s.kind==='risks').flatMap(s=>s.content.items||[]).filter(r=>r.status!=='Closed');const blocked=ts.filter(t=>t.status==='Blocked'||blockedBy(t).length).length;const metrics=[['Mission progress',rollup(ts)+'%',completed+' of '+ts.length+' tasks complete','gantt'],['Active tasks',ts.length-completed,blocked+' waiting or blocked','tasks'],['Past due',late,late?'Needs schedule attention':'No overdue tasks','clock'],['Open risks',risks.length,risks.filter(r=>r.likelihood*r.impact>=12).length+' high exposure','alert']];const sections=S.sections.filter(s=>!s.archived).sort((a,b)=>a.position-b.position);return `<div class="metric-grid">${metrics.map(([label,val,detail,ico])=>`<div class="metric"><div class="metric-top">${label}<span class="metric-icon">${icon(ico,18)}</span></div><div class="metric-value">${val}</div><div class="metric-detail">${detail}</div></div>`).join('')}</div><div class="dashboard-grid">${sections.length?sections.map(sectionView).join(''):`<div class="panel wide"><div class="empty"><strong>Your dashboard is ready to shape.</strong>${admin()?'Add a schedule, budget, risk, or notes section.':'An admin can add dashboard sections.'}</div></div>`}</div>`}

function renderWbs(){const stage=$('#wbs-stage');if(!stage)return;const nodes=[],edges=[],width=1060,teamCenters=[180,530,880];nodes.push({id:'mission',type:'mission',x:400,y:25,w:260,h:100,title:S.mission,meta:'Mission · '+activeTasks().length+' tasks'});let maxY=260;TEAMS.forEach((team,index)=>{const center=teamCenters[index],tid='team-'+team,ts=activeTasks().filter(t=>t.team===team);nodes.push({id:tid,type:'team',x:center-110,y:180,w:220,h:90,title:team,meta:ts.length+' tasks · '+rollup(ts)+'% complete',team});edges.push(['mission',tid]);if(S.wbsCollapsed.has(tid))return;const groups=[...subteams(team).map(s=>({id:s.id,name:s.name,tasks:ts.filter(t=>t.subteam_id===s.id)})),...(ts.some(t=>!t.subteam_id)?[{id:'unassigned-'+team,name:'Team-level tasks',tasks:ts.filter(t=>!t.subteam_id)}]:[])];if(!groups.length)groups.push({id:'empty-'+team,name:'No subteams yet',tasks:[],empty:true});let y=312;for(const group of groups){const sid='sub-'+group.id;nodes.push({id:sid,type:'subteam',x:center-110,y,w:220,h:92,title:group.name,meta:group.empty?'Admins can add subteams':group.tasks.length+' tasks',team});edges.push([tid,sid]);y+=125;if(!S.wbsCollapsed.has(sid)){for(const t of group.tasks){nodes.push({id:t.id,type:'task',x:center-92,y,w:220,h:112,title:t.name,meta:t.status+' · '+t.progress+'%',team,task:t});edges.push([sid,t.id]);y+=143}}y+=24}maxY=Math.max(maxY,y)});S.wbsNodes=nodes;stage.style.width=width+'px';stage.style.height=maxY+'px';stage.innerHTML=`<svg class="wbs-svg" width="${width}" height="${maxY}" aria-hidden="true"><defs><marker id="dep-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#598af5"/></marker></defs><g>${edges.map(([a,b])=>{const parent=nodes.find(n=>n.id===a),child=nodes.find(n=>n.id===b);if(parent.type==='mission')return `<path class="wbs-edge" d="M${parent.x+parent.w/2} ${parent.y+parent.h}V150H${child.x+child.w/2}V${child.y}"/>`;const lane=parent.x-18;return `<path class="wbs-edge" d="M${parent.x+parent.w/2} ${parent.y+parent.h}V${parent.y+parent.h+15}H${lane}V${child.y+child.h/2}H${child.x}"/>`}).join('')}</g><g id="dependency-edges"></g></svg>${nodes.map(n=>`<button class="wbs-node ${n.type}" data-action="${n.type==='task'?'view-task':'wbs-collapse'}" data-id="${esc(n.id)}" data-node="${esc(n.id)}" style="left:${n.x}px;top:${n.y}px;--tc:${COLORS[n.team]||'#142238'}" ${n.type!=='task'&&n.type!=='mission'?`aria-expanded="${!S.wbsCollapsed.has(n.id)}"`:''}><span class="wbs-title">${esc(n.title)}</span><span class="node-meta">${esc(n.meta)}${S.wbsCollapsed.has(n.id)?' · collapsed':''}</span>${n.type==='task'?progress(n.task.progress,n.team):''}</button>`).join('')}`;applyWbsZoom()}

function highlightDependencies(id){const g=$('#dependency-edges');if(!g)return;document.querySelectorAll('.wbs-node.related').forEach(e=>e.classList.remove('related'));g.innerHTML='';const ts=activeTasks(),task=ts.find(t=>t.id===id);if(!task)return;const relationships=[...task.dependencies.map(d=>[d,id]),...ts.filter(t=>t.dependencies.includes(id)).map(t=>[id,t.id])];const visible=S.wbsNodes;for(const [a,b]of relationships){const p=visible.find(n=>n.id===a),q=visible.find(n=>n.id===b);if(!p||!q)continue;const same=p.team===q.team;const fromX=same?p.x+p.w:p.x+(p.x<q.x?p.w:0),toX=same?q.x+q.w:q.x+(p.x<q.x?0:q.w),fromY=p.y+p.h/2,toY=q.y+q.h/2,bend=same?fromX+45:(fromX+toX)/2;g.innerHTML+=`<path class="dependency-edge" marker-end="url(#dep-arrow)" d="M${fromX} ${fromY}C${bend} ${fromY},${bend} ${toY},${toX} ${toY}"/>`;for(const node of document.querySelectorAll('[data-node]'))if(node.dataset.node===a||node.dataset.node===b)node.classList.add('related')}}

– ${fmtDate(b)} · ${p}%"><span style="width:${p}%"></span></button>`:'<span class="gantt-empty-row">No tasks scheduled</span>'}</div>`}).join('')}<div class="today-line" style="left:${(day(today())-day(start)+.5)*dayWidth}px"></div><span class="today-tag" style="left:${(day(today())-day(start)+.5)*dayWidth-13}px">Today</span></div></div>`;S.ganttRange={start,end,days};}

function selectOptions(values,selected){return values.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}
function openTaskForm(id){if(S.demo){toast('Sign in to create or edit real tasks.');return}const t=id?activeTasks().find(t=>t.id===id):null;if(t&&!editable(t)){toast('You can edit only your own tasks.',true);return}const team=t?.team||S.team||'Systems';openModal(t?'Edit task':'Create task',`<form id="task-form" data-id="${t?.id||''}" data-version="${t?.version||0}" class="form-grid"><div class="field full"><label for="task-name">Task name</label><input id="task-name" name="name" value="${esc(t?.name||'')}" required maxlength="160" placeholder="What needs to be accomplished?"></div><div class="field"><label for="task-team-input">Team</label><select id="task-team-input" name="team">${selectOptions(TEAMS,team)}</select></div><div class="field"><label for="task-subteam">Subteam <span>optional</span></label><select id="task-subteam" name="subteam_id">${subteamOptions(team,t?.subteam_id)}</select></div><div class="field"><label for="task-start">Start date</label><input id="task-start" name="start_date" type="date" required value="${t?.start_date||today()}"></div><div class="field"><label for="task-end">End date</label><input id="task-end" name="end_date" type="date" required min="${t?.start_date||today()}" value="${t?.end_date||dateAdd(today(),7)}"></div><div class="field full"><label for="task-description">Description</label><textarea id="task-description" name="description" maxlength="10000" required placeholder="Scope, deliverables, and acceptance criteria…">${esc(t?.description||'')}</textarea></div><div class="field"><label for="task-status-input">Status</label><select id="task-status-input" name="status">${selectOptions(STATUSES,t?.status||'Not started')}</select></div><div class="field"><label for="task-progress">Progress (%)</label><input id="task-progress" name="progress" type="number" min="0" max="100" step="1" required value="${t?.progress||0}"></div><div class="field"><label for="task-priority">Priority</label><select id="task-priority" name="priority">${selectOptions(['Low','Medium','High'],t?.priority||'Medium')}</select></div>${admin()?`<div class="field"><label for="task-owner-input">Owner</label><select id="task-owner-input" name="owner_id">${S.profiles.map(p=>`<option value="${p.id}" ${p.id===(t?.owner_id||S.profile.id)?'selected':''}>${esc(p.display_name)}</option>`).join('')}</select></div>`:''}<div class="field full"><label>Prerequisite tasks <span>optional</span></label><div class="field-help">This task depends on the selected tasks. Cycles are prevented.</div><div class="dependencies">${activeTasks().filter(x=>x.id!==id).map(x=>`<label class="dependency-option"><input type="checkbox" name="dependencies" value="${x.id}" ${t?.dependencies.includes(x.id)?'checked':''}><div>${esc(x.name)}<span>${x.team} · ${esc(x.status)} · due ${fmtDate(x.end_date)}</span></div></label>`).join('')||'<div class="empty" style="padding:15px">No other tasks yet.</div>'}</div></div><div id="form-error" class="notice error hidden field full" role="alert"></div></form>`,`${button('Cancel','close-modal','ghost')}<button class="button primary" type="submit" form="task-form">${t?'Save changes':'Create task'}</button>`)}
function subteamOptions(team,id){return '<option value="">None · team-level task</option>'+subteams(team).map(s=>`<option value="${s.id}" ${s.id===id?'selected':''}>${esc(s.name)}</option>`).join('')}
function viewTask(id){const t=activeTasks().find(t=>t.id===id);if(!t)return;const deps=t.dependencies.map(id=>activeTasks().find(x=>x.id===id)).filter(Boolean),dependents=activeTasks().filter(x=>x.dependencies.includes(id));openModal(t.name,`<div class="task-detail"><div class="flex wrap">${badge(t.status)}${badge(t.priority+' priority')}${overdue(t)?badge('Overdue'):''}</div><div class="description">${esc(t.description||'No description provided.')}</div><div class="detail-grid"><div><div class="detail-label">Team / subteam</div><div class="detail-value">${t.team} · ${esc(S.subteams.find(s=>s.id===t.subteam_id)?.name||'Team level')}</div></div><div><div class="detail-label">Owner</div><div class="detail-value">${esc(person(t.owner_id))}</div></div><div><div class="detail-label">Schedule</div><div class="detail-value">${fmtDate(t.start_date,true)} – ${fmtDate(t.end_date,true)}</div></div><div><div class="detail-label">Progress</div><div class="detail-value">${t.progress}%${progress(t.progress,t.team)}</div></div></div><div><h3>Prerequisites</h3>${deps.length?deps.map(d=>`<div class="list-row" style="padding:10px 0"><button class="task-name" data-action="view-task" data-id="${d.id}">${esc(d.name)}</button>${badge(d.status)}</div>`).join(''):'<p class="small muted" style="margin-top:7px">No prerequisites.</p>'}</div><div><h3>Dependent tasks</h3>${dependents.length?dependents.map(d=>`<div class="list-row" style="padding:10px 0"><button class="task-name" data-action="view-task" data-id="${d.id}">${esc(d.name)}</button>${badge(d.status)}</div>`).join(''):'<p class="small muted" style="margin-top:7px">No tasks depend on this task.</p>'}</div></div>`,`${editable(t)?`<button class="button ghost danger" data-action="archive-task" data-id="${id}" style="margin-right:auto">Archive task</button>`:''}${button('Close','close-modal','ghost')}${editable(t)?`<button class="button primary" data-action="edit-task" data-id="${id}">${icon('edit',16)}Edit task</button>`:''}`)}
function hasCycle(id,deps){const map=new Map(activeTasks().map(t=>[t.id,t.dependencies]));map.set(id,deps);function reaches(current,path){if(current===id)return true;if(path.has(current))return false;const next=new Set(path);next.add(current);return(map.get(current)||[]).some(d=>reaches(d,next))}return deps.some(d=>reaches(d,new Set()))}
async function submitTask(form){const data=Object.fromEntries(new FormData(form));const deps=new FormData(form).getAll('dependencies');data.dependencies=deps;data.progress=Number(data.progress);data.id=form.dataset.id||null;data.version=Number(form.dataset.version);if(data.end_date<data.start_date)throw Error('The end date must be on or after the start date.');if(hasCycle(data.id||'new-task',deps))throw Error('These prerequisites would create a dependency cycle.');if(data.progress===100)data.status='Complete';else if(data.status==='Complete')data.progress=100;await rpc('sd_save_task',{p_task:data});await loadData();closeModal();toast(data.id?'Task updated.':'Task created. WBS and schedule updated.');}
function accountModal(){if(S.demo){openModal('Sample workspace','<p class="muted">This preview uses sample data. Sign in to save your own tasks and manage the mission.</p>',`${button('Close','close-modal','ghost')}${button('Go to sign in','exit-demo','primary')}`);return}openModal('Your account',`<form id="profile-form" class="stack"><div class="field"><label for="profile-name">Display name</label><input id="profile-name" name="name" value="${esc(S.profile.display_name)}" maxlength="80" required></div><div class="small muted">${esc(S.session.user.email)} · ${esc(S.profile.role)}</div></form>`,`${button('Sign out','signout','ghost','logout')}<button class="button primary" type="submit" form="profile-form">Save name</button>`)}
function addSubteam(){openModal('Add subteam',`<form id="subteam-form" class="form-grid"><div class="field"><label for="subteam-team">Parent team</label><select name="team" id="subteam-team">${selectOptions(TEAMS,'Systems')}</select></div><div class="field"><label for="subteam-name">Subteam name</label><input name="name" id="subteam-name" maxlength="80" required placeholder="e.g. Integration & verification"></div><div id="form-error" class="notice error hidden field full" role="alert"></div></form>`,`${button('Cancel','close-modal','ghost')}<button class="button primary" type="submit" form="subteam-form">Add subteam</button>`)}
function sectionForm(id){const s=id?S.sections.find(x=>x.id===id):null;S.editingSection=s?JSON.parse(JSON.stringify(s)):{kind:'note',content:{},position:S.sections.length,version:0};openModal(s?'Edit dashboard section':'Add dashboard section',`<form id="section-form" data-id="${s?.id||''}" class="form-grid"><div class="field full"><label for="section-title">Section title</label><input name="title" id="section-title" maxlength="100" required value="${esc(s?.title||'')}"></div><div class="field"><label for="section-kind">Section type</label><select id="section-kind" name="kind">${['schedule','budgets','risks','note'].map(k=>`<option value="${k}" ${(s?.kind||'note')===k?'selected':''}>${({schedule:'Schedule status',budgets:'System budgets',risks:'Risk register',note:'Notes'})[k]}</option>`).join('')}</select></div><div class="field"><label for="section-position">Position</label><input id="section-position" name="position" type="number" min="1" max="100" required value="${(s?.position??S.sections.length)+1}"></div><div id="section-fields" class="field full"></div><div id="form-error" class="notice error hidden field full" role="alert"></div></form>`,`${button('Cancel','close-modal','ghost')}<button class="button primary" type="submit" form="section-form">Save section</button>`);renderSectionFields()}
function renderSectionFields(){const s=S.editingSection,container=$('#section-fields');if(!container)return;if(s.kind==='note'){container.innerHTML=`<label for="section-text">Mission notes</label><textarea name="text" id="section-text" rows="7" maxlength="20000">${esc(s.content.text||'')}</textarea>`}else if(s.kind==='schedule'){container.innerHTML='<div class="notice">This section automatically summarizes the Systems, Ground, and Aerial tasks.</div>'}else{const items=s.content.items||[];container.innerHTML=`<div class="flex between"><label style="font-weight:600;font-size:14px">${s.kind==='budgets'?'Budget allocations':'Mission risks'}</label>${button(s.kind==='budgets'?'Add budget':'Add risk','section-add-item','ghost','plus')}</div>${items.map((b,i)=>s.kind==='budgets'?`<div class="section-mini form-grid" data-item-index="${i}"><div class="field full"><label>Budget name</label><input data-item-key="name" value="${esc(b.name||'')}" required maxlength="100"></div><div class="field"><label>Allocated</label><input data-item-key="allocated" type="number" step="any" min="0.001" value="${b.allocated??100}" required></div><div class="field"><label>Used</label><input data-item-key="used" type="number" step="any" min="0" value="${b.used??0}" required></div><div class="field"><label>Unit</label><input data-item-key="unit" maxlength="30" value="${esc(b.unit||'kg')}" required></div><div class="field" style="align-self:end"><button type="button" class="button ghost danger" data-action="section-remove-item" data-index="${i}">Remove budget</button></div></div>`:`<div class="section-mini form-grid" data-item-index="${i}"><div class="field full"><label>Risk name</label><input data-item-key="name" value="${esc(b.name||'')}" required maxlength="160"></div><div class="field"><label>Likelihood (1–5)</label><input data-item-key="likelihood" type="number" min="1" max="5" step="1" required value="${b.likelihood||1}"></div><div class="field"><label>Impact (1–5)</label><input data-item-key="impact" type="number" min="1" max="5" step="1" required value="${b.impact||1}"></div><div class="field"><label>Owner</label><input data-item-key="owner" value="${esc(b.owner||'')}" maxlength="80" required></div><div class="field"><label>Status</label><select data-item-key="status">${selectOptions(['Open','Mitigating','Closed'],b.status||'Open')}</select></div><div class="field full"><label>Mitigation</label><textarea data-item-key="mitigation" maxlength="2000" required>${esc(b.mitigation||'')}</textarea></div><div class="field full"><button type="button" class="button ghost danger" data-action="section-remove-item" data-index="${i}">Remove risk</button></div></div>`).join('')||'<div class="empty" style="padding:20px">Add the first item to this section.</div>'}`}}
function collectSectionContent(){const s=S.editingSection;if(s.kind==='note'){s.content={text:$('#section-text')?.value||''};return}s.content={items:[...document.querySelectorAll('[data-item-index]')].map(row=>Object.fromEntries([...row.querySelectorAll('[data-item-key]')].map(input=>[input.dataset.itemKey,input.type==='number'?Number(input.value):input.value])))};}
async function submitSection(form){collectSectionContent();const data=Object.fromEntries(new FormData(form)),s=S.editingSection;await rpc('sd_save_section',{p_section:{id:form.dataset.id||null,version:s.version,title:data.title,kind:data.kind,position:Number(data.position)-1,content:s.content}});await loadData();closeModal();toast('Dashboard section saved.')}
function confirmModal(title,description,action,id){openModal(title,`<p>${esc(description)}</p><div id="form-error" class="notice error hidden" role="alert" style="margin-top:16px"></div>`,`${button('Cancel','close-modal','ghost')}<button class="button danger" data-action="${action}" data-id="${id}">Confirm</button>`)}
function csvExport(){const cols=['Task','Description','Team','Subteam','Owner','Start','End','Status','Progress','Priority','Prerequisites'];const rows=filteredTasks().map(t=>[t.name,t.description,t.team,S.subteams.find(s=>s.id===t.subteam_id)?.name||'',person(t.owner_id),t.start_date,t.end_date,t.status,t.progress,t.priority,t.dependencies.map(id=>activeTasks().find(x=>x.id===id)?.name||id).join('; ')]);const safe=v=>{let s=String(v??'');if(/^[=+@\-\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const blob=new Blob(['\ufeff'+[cols,...rows].map(row=>row.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mission-tasks-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Task CSV exported.')}
async function action(el){const a=el.dataset.action,id=el.dataset.id;switch(a){case 'req-tab':S.reqTab=el.dataset.group;$('#page').innerHTML=requirementsView();break;case 'new-requirement':openRequirementForm();break;case 'edit-requirement':openRequirementForm(id);break;case 'view-requirement':viewRequirement(id);break;case 'nav':S.page=el.dataset.page;render();break;case 'mobile-menu':$('.sidebar').classList.toggle('open');break;case 'auth-signin':authPage('signin');break;case 'auth-signup':authPage('signup');break;case 'demo':sampleData();break;case 'exit-demo':closeModal();S.profile=null;S.page='dashboard';authPage();break;case 'demo-warning':toast('Sign in to create and save real tasks.');break;case 'close-modal':closeModal();break;case 'account':accountModal();break;case 'new-task':openTaskForm();break;case 'edit-task':closeModal();openTaskForm(id);break;case 'view-task':if($('#modal').open)closeModal();viewTask(id);break;case 'refresh':await loadData();toast('Workspace refreshed.');break;case 'signout':{try{await request('/auth/v1/logout',{method:'POST'})}catch{}setSession(null);S.profile=null;S.page='dashboard';closeModal();authPage();break;}case 'forgot':{const email=$('#email').value;if(!email||!$('#email').checkValidity()){toast('Enter your email address first.',true);$('#email').focus();break}await request('/auth/v1/recover?redirect_to='+encodeURIComponent(location.href.split(/[?#]/)[0]),{method:'POST',auth:false,body:{email}});toast('Check your email for a password reset link.');break}case 'reset-filters':S.search='';S.team='';S.status='';S.mine=false;render();break;case 'export':csvExport();break;case 'wbs-collapse':if(id==='mission')break;S.wbsCollapsed.has(id)?S.wbsCollapsed.delete(id):S.wbsCollapsed.add(id);renderWbs();break;case 'wbs-in':S.wbsZoom=Math.min(1.5,S.wbsZoom+.1);applyWbsZoom();break;case 'wbs-out':S.wbsZoom=Math.max(.4,S.wbsZoom-.1);applyWbsZoom();break;case 'wbs-fit':S.wbsZoom=Math.min(1,($('#wbs-viewport').clientWidth-25)/1060);applyWbsZoom();break;case 'gantt-toggle':if(S.expanded.has(id)){S.expanded.delete(id)}else{S.expanded.add(id);if(id.startsWith('team-'))subteams(id.slice(5)).forEach(s=>S.expanded.add(s.id))}renderGantt();break;case 'gantt-expand':TEAMS.forEach(t=>S.expanded.add('team-'+t));S.subteams.forEach(t=>S.expanded.add(t.id));renderGantt();break;case 'gantt-collapse':S.expanded.clear();renderGantt();break;case 'gantt-detail':{const t=activeTasks().find(x=>x.id===id);$('#gantt-detail').innerHTML=`<div class="flex between"><div><strong>${esc(t.name)}</strong><div class="small muted">${fmtDate(t.start_date,true)} – ${fmtDate(t.end_date,true)} · ${t.progress}% complete · ${t.dependencies.length} prerequisites</div></div><button class="button" data-action="view-task" data-id="${id}">View task</button></div>`;break}case 'add-subteam':addSubteam();break;case 'add-section':sectionForm();break;case 'edit-section':sectionForm(id);break;case 'section-add-item':collectSectionContent();S.editingSection.content.items??=[];S.editingSection.content.items.push(S.editingSection.kind==='budgets'?{name:'',allocated:100,used:0,unit:'kg'}:{name:'',likelihood:1,impact:1,status:'Open',owner:'',mitigation:''});renderSectionFields();break;case 'section-remove-item':collectSectionContent();S.editingSection.content.items.splice(Number(el.dataset.index),1);renderSectionFields();break;case 'archive-task':{const t=activeTasks().find(x=>x.id===id);confirmModal('Archive task?','This removes the task from active views and removes it from other tasks’ prerequisites. The task remains stored in the database.','do-archive-task',id);S.archiveVersion=t.version;break}case 'do-archive-task':await rpc('sd_archive_task',{p_id:id,p_version:S.archiveVersion});await loadData();closeModal();toast('Task archived.');break;case 'archive-subteam':confirmModal('Remove subteam?','Its tasks will move to the parent team. No tasks will be deleted.','do-archive-subteam',id);break;case 'do-archive-subteam':await rpc('sd_archive_subteam',{p_id:id});await loadData();closeModal();toast('Subteam removed; tasks moved to the parent team.');break;case 'archive-section':confirmModal('Remove dashboard section?','This hides the section from the dashboard. Its content remains stored.','do-archive-section',id);break;case 'do-archive-section':{const s=S.sections.find(s=>s.id===id);await rpc('sd_save_section',{p_section:{...s,archived:true}});await loadData();closeModal();toast('Dashboard section removed.');break}}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();if(el.disabled)return;el.disabled=true;try{await action(el)}catch(err){const box=$('#form-error');if(box){box.textContent=err.message;box.classList.remove('hidden')}else toast(err.message,true)}finally{if(el.isConnected)el.disabled=false}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id==='auth-form'){await submitAuth(f);return}const submit=document.querySelector(`[form="${f.id}"][type="submit"]`)||f.querySelector('[type="submit"]');if(submit)submit.disabled=true;const box=$('#form-error');if(box)box.classList.add('hidden');try{if(f.id==='requirement-form')await submitRequirement(f);else if(f.id==='task-form')await submitTask(f);else if(f.id==='section-form')await submitSection(f);else if(f.id==='subteam-form'){const d=Object.fromEntries(new FormData(f));await rpc('sd_save_subteam',{p_team:d.team,p_name:d.name});await loadData();closeModal();toast('Subteam added.')}else if(f.id==='mission-form'){await rpc('sd_set_mission',{p_name:new FormData(f).get('mission')});await loadData();toast('Mission name saved.')}else if(f.id==='profile-form'){await rpc('sd_set_name',{p_name:new FormData(f).get('name')});await loadData();closeModal();toast('Display name saved.')}}catch(err){if(box){box.textContent=err.message;box.classList.remove('hidden')}else toast(err.message,true)}finally{if(submit?.isConnected)submit.disabled=false}});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){S.search=e.target.value;updateTaskRows()}if(e.target.id==='task-progress'){const val=Number(e.target.value);if(val===100)$('#task-status-input').value='Complete';else if($('#task-status-input').value==='Complete')$('#task-status-input').value='In progress'}if(e.target.id==='task-start')$('#task-end').min=e.target.value});
document.addEventListener('change',async e=>{const el=e.target;try{if(el.id==='req-level')$('#req-parents').innerHTML=requirementParents($('#requirement-form').dataset.id,el.value);if(el.id==='task-team'){S.team=el.value;updateTaskRows()}if(el.id==='task-status'){S.status=el.value;updateTaskRows()}if(el.id==='task-mine'){S.mine=el.checked;updateTaskRows()}if(el.id==='task-team-input')$('#task-subteam').innerHTML=subteamOptions(el.value);if(el.id==='task-status-input'){if(el.value==='Complete')$('#task-progress').value=100;else if(Number($('#task-progress').value)===100)$('#task-progress').value=0;}if(el.id==='gantt-zoom'){S.ganttZoom=Number(el.value);renderGantt()}if(el.id==='section-kind'){S.editingSection.kind=el.value;S.editingSection.content={};renderSectionFields()}if(el.dataset.roleUser){await rpc('sd_set_role',{p_user:el.dataset.roleUser,p_role:el.value});await loadData();toast('Account role updated.')}}catch(err){toast(err.message,true);if(el.dataset.roleUser)await loadData()}});
document.addEventListener('mouseover',e=>{const node=e.target.closest('.wbs-node.task');if(node)highlightDependencies(node.dataset.id)});
document.addEventListener('mouseout',e=>{const node=e.target.closest('.wbs-node.task');if(node&&!node.contains(e.relatedTarget))highlightDependencies(null)});
document.addEventListener('focusin',e=>{if(e.target.matches('.wbs-node.task'))highlightDependencies(e.target.dataset.id)});
document.addEventListener('focusout',e=>{if(e.target.matches('.wbs-node.task'))highlightDependencies(null)});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
window.addEventListener('offline',()=>{const c=$('.connection');if(c)c.textContent='Offline · saved data is unchanged'});
window.addEventListener('online',async()=>{if(S.session&&S.profile&&!S.demo)try{await loadData(false);toast('Connection restored.')}catch{}});
window.addEventListener('storage',e=>{if(e.key==='mission-control-session'&&!e.newValue){setSession(null);S.profile=null;authPage()}});
async function boot(){try{const hash=new URLSearchParams(location.hash.slice(1));if(hash.has('access_token')){const access=hash.get('access_token');const user=await fetch(CONFIG.url+'/auth/v1/user',{headers:{apikey:CONFIG.key,Authorization:'Bearer '+access}}).then(async r=>{if(!r.ok)throw Error('This sign-in link is invalid or expired.');return r.json()});setSession({access_token:access,refresh_token:hash.get('refresh_token'),expires_at:Date.now()/1000+Number(hash.get('expires_in')||3600),user});history.replaceState(null,'',location.pathname+location.search);if(hash.get('type')==='recovery'){authPage('recovery');return}}else S.session=storageGet();if(!S.session){authPage();return}await initializeProfile();render()}catch(e){authPage('signin',e.message)}}
setInterval(async()=>{if(!S.demo&&S.profile&&S.session&&!document.hidden&&!$('#modal').open){try{const priorRole=S.profile.role;await loadData(false);if(priorRole!==S.profile.role){render();return}if(S.page==='requirements')$('#page').innerHTML=requirementsView();else if(S.page==='dashboard')$('#page').innerHTML=dashboardView();else if(S.page==='tasks')updateTaskRows();else if(S.page==='gantt')renderGantt();else if(S.page==='wbs')renderWbs();const c=$('.connection');if(c)c.textContent='Saved to cloud · '+S.lastSync.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch{const c=$('.connection');if(c)c.textContent='Sync unavailable · use Refresh to retry'}}},30000);

"Open","owner_name":"","verification":"","notes":"","target":"TBD km","parents":[],"version":1,"archived":false},{"id":"59864dcc-178a-53f0-9805-cc3c1b3600f7","code":"REQ-TBD-04","group_name":"TBD Register","level":2,"statement":"Maximum terrain slope","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD deg","parents":[],"version":1,"archived":false},{"id":"878c2a6f-23c4-52fb-8f7a-b53308a5f429","code":"REQ-TBD-05","group_name":"TBD Register","level":2,"statement":"Minimum PSR operating duration","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD hr","parents":[],"version":1,"archived":false},{"id":"d5466d7a-6da8-5085-ab65-3a5af89c094c","code":"REQ-TBD-06","group_name":"TBD Register","level":2,"statement":"Water-ice detection threshold/uncertainty","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD","parents":[],"version":1,"archived":false},{"id":"6332b5c6-4e2d-5f73-ac37-1d4c30b8abe4","code":"REQ-TBD-07","group_name":"TBD Register","level":2,"statement":"Regolith-composition accuracy","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD","parents":[],"version":1,"archived":false},{"id":"64e6e974-51e2-55a3-adda-c80fd63b503e","code":"REQ-TBD-08","group_name":"TBD Register","level":2,"statement":"Orbital resource-map spatial resolution","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD m/pixel","parents":[],"version":1,"archived":false},{"id":"7cc30be4-d5bb-56bb-b345-3c44dfa55d52","code":"REQ-TBD-09","group_name":"TBD Register","level":2,"statement":"Local surface-map spatial resolution","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD m","parents":[],"version":1,"archived":false},{"id":"4ecf7a77-c057-5c27-add9-49653e76885f","code":"REQ-TBD-10","group_name":"TBD Register","level":2,"statement":"Surface-system localization accuracy","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD m","parents":[],"version":1,"archived":false},{"id":"6cb241e1-7fbb-5786-9658-4ce0db9ffc07","code":"REQ-TBD-11","group_name":"TBD Register","level":2,"statement":"Orbiter-to-surface minimum data rate","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD kbps/Mbps","parents":[],"version":1,"archived":false},{"id":"62bdbcb5-475a-5c15-bd17-40be80245998","code":"REQ-TBD-12","group_name":"TBD Register","level":2,"statement":"Earth downlink requirement","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD","parents":[],"version":1,"archived":false},{"id":"5501dae0-163e-5671-82a1-0db2fcf5d9fa","code":"REQ-TBD-13","group_name":"TBD Register","level":2,"statement":"Orbiter operational lifetime","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD","parents":[],"version":1,"archived":false},{"id":"1b35979f-201e-51a5-8c10-1543052d7212","code":"REQ-TBD-14","group_name":"TBD Register","level":2,"statement":"Surface operational lifetime","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD","parents":[],"version":1,"archived":false},{"id":"8b783e79-9143-59c0-8cdc-9ee7bcbc065d","code":"REQ-TBD-15","group_name":"TBD Register","level":2,"statement":"Lander delivery-mass requirement","basis":"","status":"Open","owner_name":"","verification":"","notes":"","target":"TBD kg","parents":[],"version":1,"archived":false}];
const REQ_GROUPS=['Mission','Launch Vehicle','Orbiter','Lander','Surface System','Science','TBD Register'];
const REQ_LEVELS={1:'Mission',2:'Subteam / system',3:'Sub-subteam / subsystem'};
Object.assign(S,{requirements:[],reqReady:false,reqError:'',reqTab:'Mission'});
function requirementsView(){
 const groups=[...new Set([...REQ_GROUPS,...S.requirements.map(r=>r.group_name)])];
 const rows=S.requirements.filter(r=>r.group_name===S.reqTab).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}));
 return `${S.reqError?'<div class="notice error" style="margin-bottom:18px">Requirements could not be loaded. Use Refresh to retry. Other workspace pages remain available.</div>':''}<div class="req-tabs" role="tablist" aria-label="Requirement sets">${groups.map(g=>`<button role="tab" id="req-tab-${groups.indexOf(g)}" aria-controls="req-panel" aria-selected="${g===S.reqTab}" data-action="req-tab" data-group="${esc(g)}">${esc(g)} <span>${S.requirements.filter(r=>r.group_name===g).length}</span></button>`).join('')}</div><section id="req-panel" role="tabpanel" aria-labelledby="req-tab-${groups.indexOf(S.reqTab)}" class="panel"><div class="panel-head"><div><h2>${esc(S.reqTab)}</h2><p class="small muted" style="margin:6px 0 0">${rows.length} ${S.reqTab==='TBD Register'?'controlled targets':'requirements'} · ${S.demo?'Workbook preview':admin()?'Admins and owner can edit':'Read only · admins and owner can edit'}</p></div>${admin()&&S.reqReady?button('New requirement','new-requirement','primary','plus'):''}</div><div class="req-list">${rows.map(r=>`<article class="req-card"><div class="flex between wrap"><div class="flex wrap"><strong class="req-code">${esc(r.code)}</strong>${badge(r.status)}<span class="small muted">${REQ_LEVELS[r.level]}</span></div>${admin()&&S.reqReady?`<button class="button ghost" data-action="edit-requirement" data-id="${r.id}">${icon('edit')}Edit</button>`:''}</div><p class="req-statement">${esc(r.statement)}</p>${r.target?`<div class="req-target"><strong>Working target</strong> ${esc(r.target)}</div>`:''}<dl class="req-meta"><div><dt>Basis / source</dt><dd>${esc(r.basis||'Not assigned')}</dd></div><div><dt>Owner</dt><dd>${esc(r.owner_name||'Unassigned')}</dd></div><div><dt>Verification</dt><dd>${esc(r.verification||'Not assigned')}</dd></div></dl>${r.notes?`<p class="req-notes"><strong>Review notes</strong> ${esc(r.notes)}</p>`:''}<div class="req-links"><span class="small muted">Parent requirements</span>${r.parents.length?r.parents.map(id=>requirementLink(id)).join(''):r.level===1?'<span class="small">Mission-level requirement</span>':'<span class="small">Not linked yet</span>'}</div><div class="req-links"><span class="small muted">Derived requirements</span>${S.requirements.filter(c=>c.parents.includes(r.id)).map(c=>requirementLink(c.id)).join('')||'<span class="small">None linked yet</span>'}</div></article>`).join('')||'<div class="empty"><strong>No requirements in this set.</strong>'+(!S.reqReady&&!S.demo?'Requirements are unavailable.':admin()?'Create the first requirement.':'No requirements have been added yet.')+'</div>'}</div></section>`;
}
function requirementLink(id){const r=S.requirements.find(r=>r.id===id);return r?`<button class="req-link" data-action="view-requirement" data-id="${r.id}" title="${esc(r.statement)}">${esc(r.code)} · ${esc(r.group_name)}</button>`:'<span class="small">Unavailable requirement</span>'}
function requirementParents(id,level,selected=[]){return S.requirements.filter(r=>r.id!==id&&r.level===Number(level)-1).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true})).map(r=>`<label class="dependency-option"><input type="checkbox" name="parents" value="${r.id}" ${selected.includes(r.id)?'checked':''}><div><strong>${esc(r.code)}</strong> · ${esc(r.group_name)}<span>${esc(r.statement)}</span></div></label>`).join('')||`<div class="empty" style="padding:15px">${Number(level)===1?'Mission requirements have no parents.':'No requirements exist at the level above yet.'}</div>`}
function openRequirementForm(id){
 if(!admin())throw Error('Only admins and the owner can edit requirements.');
 if(!S.reqReady)throw Error('Requirements are unavailable. Refresh and try again.');
 const r=id?S.requirements.find(r=>r.id===id):null;if(id&&!r)throw Error('Requirement no longer exists. Refresh and try again.');
 const field=(name,label,value='',max=1000)=>`<div class="field"><label for="req-${name}">${label}</label><input name="${name}" id="req-${name}" maxlength="${max}" value="${esc(value)}"></div>`;
 openModal(r?'Edit requirement':'New requirement',`<form id="requirement-form" data-id="${r?.id||''}" data-version="${r?.version||0}" class="form-grid"><div class="field"><label for="req-code">Requirement ID</label><input id="req-code" name="code" maxlength="80" required value="${esc(r?.code||'')}" placeholder="e.g. ORB-COM-001"></div><div class="field"><label for="req-group">Tab / requirement set</label><input id="req-group" name="group_name" list="req-groups" maxlength="100" required value="${esc(r?.group_name||S.reqTab)}"><datalist id="req-groups">${[...new Set([...REQ_GROUPS,...S.requirements.map(r=>r.group_name)])].map(g=>`<option value="${esc(g)}"></option>`).join('')}</datalist><div class="field-help">Choose an existing set or type a new name to create a tab.</div></div><div class="field"><label for="req-level">Hierarchy level</label><select id="req-level" name="level">${Object.entries(REQ_LEVELS).map(([n,label])=>`<option value="${n}" ${Number(n)===(r?.level||(S.reqTab==='Mission'?1:2))?'selected':''}>${label}</option>`).join('')}</select></div>${field('status','Status',r?.status||'Draft',80)}<div class="field full"><label for="req-statement">Requirement / parameter</label><textarea id="req-statement" name="statement" required maxlength="20000" rows="4">${esc(r?.statement||'')}</textarea></div>${field('basis','Basis / source',r?.basis||'',10000)}${field('owner_name','Owner',r?.owner_name||'',160)}${field('verification','Verification',r?.verification||'',10000)}${field('target','Working target (optional)',r?.target||'',1000)}<div class="field full"><label for="req-notes">Review notes</label><textarea id="req-notes" name="notes" maxlength="20000">${esc(r?.notes||'')}</textarea></div><div class="field full"><label>Parent requirements</label><div class="field-help">Select the specific requirements at the level immediately above. More than one parent is allowed.</div><div id="req-parents" class="dependencies">${requirementParents(r?.id,r?.level||(S.reqTab==='Mission'?1:2),r?.parents)}</div></div><div id="form-error" class="notice error hidden field full" role="alert"></div></form>`,`${button('Cancel','close-modal','ghost')}<button class="button primary" type="submit" form="requirement-form">Save requirement</button>`);
}
async function submitRequirement(form){
 if(!admin())throw Error('Only admins and the owner can edit requirements.');
 const fd=new FormData(form),r={...Object.fromEntries(fd),id:form.dataset.id||null,version:Number(form.dataset.version),level:Number(fd.get('level')),parents:fd.getAll('parents')};
 await rpc('sd_save_requirement',{p_requirement:r});S.reqTab=r.group_name.trim();await loadData();closeModal();toast('Requirement saved.');
}
function viewRequirement(id){const r=S.requirements.find(r=>r.id===id);if(!r)return;S.reqTab=r.group_name;S.page='requirements';render();const card=[...document.querySelectorAll('.req-card')].find(c=>c.querySelector('.req-code')?.textContent===r.code);card?.scrollIntoView({behavior:'smooth',block:'center'});card?.classList.add('req-highlight');setTimeout(()=>card?.classList.remove('req-highlight'),2000)}
document.addEventListener('keydown',e=>{if(e.target.matches('[role="tab"][data-group]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('[role="tab"][data-group]')],i=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;S.reqTab=tabs[next].dataset.group;$('#page').innerHTML=requirementsView();document.querySelectorAll('[role="tab"][data-group]')[next]?.focus()}});

boot();
</script>
</body>
</html>
